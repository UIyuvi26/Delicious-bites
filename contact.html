<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<style>
    .contact {
  padding: 50px;
  background: #e38e1e;
  text-align: center;
}

.contact h1 {
  margin-bottom: 20px;
  font-size: 2.5rem;
  color: #000000;
}

form {
  max-width: 500px;
  margin: auto;
  background: rgb(136, 17, 17);
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
}

form input, form textarea {
  width: 80%;
  margin: 10px 0;
  padding: 12px;
  border: 2px solid #000000;
  border-radius: 10px;
}

form button {
  width: 100%;
  padding: 12px;
  border: none;
  background: #010000;
  color: rgb(255, 255, 255);
  font-size: 1rem;
  border-radius: 10px;
  transition: 0.3s;
}

form button:hover {
  background: #fffdfd;
}

.socials {
  margin-top: 20px;
}
</style>
<body>
    <section class="contact" id="contact">
  <h1>Contact Me</h1>
  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
  <div class="socials">
    <p>Or connect with me: 97878 *****</p>
  
  </div>
</section>
    
</body>
</html>
